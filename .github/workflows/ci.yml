name: CI

on:
  pull_request:
  push:
    branches: [master, development]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze --fatal-infos
      - run: dart run tool/check_hardcoded_text.dart
      - run: flutter test --reporter expanded
      - name: Build APK (debug, env contoh)
        run: flutter build apk --debug --dart-define-from-file=env/example.json
